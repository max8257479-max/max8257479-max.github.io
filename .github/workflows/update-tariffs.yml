name: Daily carsharing tariff check

on:
  schedule:
    # 08:00 Minsk time (UTC+3)
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "index.html"
      - "data/anytime_manual.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-carsharing-tariffs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test parsers
        run: python -m pytest -q

      - name: Check and update tariff data
        run: python scripts/update_tariffs.py

      - name: Commit only actual data changes
        run: |
          if git diff --quiet -- tariffs.json data/anytime_watch.json; then
            echo "No tariff or monitoring changes. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tariffs.json data/anytime_watch.json
          git commit -m "chore: refresh carsharing tariff data [skip ci]"
          git push

      # GitHub Pages must be enabled once in repository Settings > Pages.
      # The workflow token cannot create a Pages site by itself.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html tariffs.json site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
