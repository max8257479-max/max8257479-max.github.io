name: Daily carsharing tariff check

on:
  schedule:
    # 08:00 Minsk time (UTC+3)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      tariff_pr_number:
        description: "Internal: PR number to validate and merge"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-audit.txt"
      - "index.html"
      - "app.js"
      - "data/anytime_manual.json"
      - "tariffs.json"
      - "data/anytime_watch.json"
      - "README.md"
      - "SECURITY.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-audit.txt"
      - "index.html"
      - "app.js"
      - "data/anytime_manual.json"
      - "tariffs.json"
      - "data/anytime_watch.json"
      - "README.md"
      - "SECURITY.md"

permissions: {}

concurrency:
  group: carsharing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify generated-data PR before checkout
        if: github.event_name == 'workflow_dispatch' && inputs.tariff_pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.tariff_pr_number }}
        shell: bash
        run: |
          mapfile -t changed_files < <(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "The tariff PR has no changed files."
            exit 1
          fi
          for path in "${changed_files[@]}"; do
            case "$path" in
              tariffs.json|data/anytime_watch.json) ;;
              *)
                echo "Refusing generated-data validation for unexpected file: $path"
                exit 1
                ;;
            esac
          done

      - name: Checkout source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install hash-verified dependencies
        run: "python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Test tariff parsers and frontend security
        run: python -m pytest -q

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Audit pinned dependencies
        run: |
          python -m venv /tmp/pip-audit-env
          /tmp/pip-audit-env/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-audit.txt
          /tmp/pip-audit-env/bin/pip-audit --strict -r requirements.txt

  update:
    name: Update tariff data
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.tariff_pr_number == ''
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install hash-verified dependencies
        run: "python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt"

      - name: Refresh tariff data from allowlisted sources
        run: python scripts/update_tariffs.py

      - name: Publish data-only pull request and trigger its validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          unexpected="$(git status --short | awk '$2 != "tariffs.json" && $2 != "data/anytime_watch.json" {print}')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed by the updater:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --quiet -- tariffs.json data/anytime_watch.json; then
            echo "No tariff data changes."
            exit 0
          fi

          git checkout -B automation/tariff-data-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tariffs.json data/anytime_watch.json
          git commit -m "chore: refresh carsharing tariff data"
          git push --force origin HEAD:refs/heads/automation/tariff-data-update

          pr_number="$(gh pr list --head automation/tariff-data-update --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head automation/tariff-data-update \
              --title "chore: refresh carsharing tariff data" \
              --body "Автоматическое обновление тарифов. В PR разрешены только tariffs.json и data/anytime_watch.json. После успешной проверки Validate PR будет автоматически объединён."
            pr_number="$(gh pr list --head automation/tariff-data-update --base main --state open --json number --jq '.[0].number')"
          fi

          gh workflow run update-tariffs.yml --ref automation/tariff-data-update -f tariff_pr_number="$pr_number"

  merge_bot_data_pr:
    name: Merge validated tariff-only update
    if: github.event_name == 'workflow_dispatch' && inputs.tariff_pr_number != '' && github.ref_name == 'automation/tariff-data-update'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Recheck PR files and validated head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.tariff_pr_number }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          actual_head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "PR head changed after validation; refusing merge."
            exit 1
          fi

          mapfile -t changed_files < <(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "The tariff PR has no changed files."
            exit 1
          fi
          for path in "${changed_files[@]}"; do
            case "$path" in
              tariffs.json|data/anytime_watch.json) ;;
              *)
                echo "Refusing automatic merge because unexpected file changed: $path"
                exit 1
                ;;
            esac
          done

      - name: Merge only after Validate succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.tariff_pr_number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout published source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html app.js tariffs.json site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Wait until the Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..10}; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' 2>/dev/null | head -n 1 || true)"
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact is visible (ID: $artifact_id)."
              exit 0
            fi
            sleep 2
          done
          echo "Pages artifact was not visible after 20 seconds."
          exit 1

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
